  own URL cannot be shortened, so this page forwards to it and keeps the link

  Static files in this repository (audio, page images) stay reachable; only the

-->

<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f2ecdf;
    color: #17160f;
    font: 16px/1.6 "Iowan Old Style", Palatino, Georgia, serif;

  }
  .box { max-width: 34ch; }
  .kicker {

  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 10px; }

  a {

    text-decoration: none;
  }
</style>
<script>
  (function () {
    var target = "https://script.google.com/a/macros/skhbbss.edu.hk/s/AKfycbz3S6G83ar5uv6emJGEJ1JubzqBbHbuzZf722vXBJ1gHx9mhYHA7IBmGxwnOUsN6jpt/exec";

    if (link) link.href = url;
    location.replace(url);
  })();
</script>
